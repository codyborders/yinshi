# OrbStack adds a global LXC service override that disables these controls.
# This unit-specific override restores the reviewed root-launcher policy.
[Service]
ReadWritePaths=/var/lib/yinshi-launcher /run/yinshi-launcher-state
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_FOWNER
NoNewPrivileges=yes
PrivateNetwork=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
