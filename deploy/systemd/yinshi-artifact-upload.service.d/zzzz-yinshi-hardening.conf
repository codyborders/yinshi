# OrbStack adds a global LXC service override that disables these controls.
# This unit-specific override restores the reviewed artifact upload policy.
[Service]
ReadWritePaths=/var/lib/yinshi/artifact-incoming
ReadOnlyPaths=/var/lib/yinshi/control
NoNewPrivileges=yes
PrivateNetwork=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
