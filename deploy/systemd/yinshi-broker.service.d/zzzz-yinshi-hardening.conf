# OrbStack adds a global LXC service override that disables these controls.
# This unit-specific override restores the reviewed broker policy.
[Service]
ReadWritePaths=/var/lib/yinshi /run/yinshi /var/lib/yinshi-launcher/staging /run/yinshi-launcher-state/workloads
ReadOnlyPaths=-/var/lib/yinshi/control/broker-journal.sqlite3
NoNewPrivileges=yes
PrivateNetwork=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
