name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: python -m pip install --upgrade pip==26.2
      - run: python -m pip install -r requirements/dev.txt pip-audit==2.10.1
      - run: python -m pip install --no-deps -e .
      - run: pytest -q
      - run: black --check src tests
      - run: isort --check-only src tests
      - run: flake8 src tests
      - run: mypy src
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm exec vitest run
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit

  desktop:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
            sidecar/package-lock.json
      - run: python -m pip install --upgrade pip==26.2
      - run: python -m pip install -r backend/requirements/dev.txt
      - run: npm ci --prefix frontend
      - run: npm ci --prefix sidecar
      - run: npm ci --prefix desktop
      - run: YINSHI_TEST_PYTHON="$(command -v python)" npm test --prefix desktop
      - run: npm run typecheck --prefix desktop
      - run: npm run build:frontend --prefix desktop
      - run: npm run build:helper --prefix desktop
      - run: npm run build --prefix desktop
      - run: file backend/dist/yinshi-desktop-helper | grep -q "Mach-O 64-bit executable arm64"

  sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm audit
      - run: docker build --tag yinshi-sidecar:${{ github.sha }} .
